<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
<title id="t">When the quadratic sorts stop</title>
<desc id="d">Log-log plot of the time of one sort against n for five quadratic sorts, Shell sort, and the slowest O(n log n) sort at each n.</desc>
<style>
  .viz { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
         --grid: #e1e0d9; --axis: #c3c2b7; --ref: #898781; --min: #2a78d6; --bubble: #eb6834; --shaker: #1baf7a; --insertion: #eda100; --binsert: #e87ba4; --shell: #4a3aa7; --ref: #898781; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
           --grid: #2c2c2a; --axis: #383835; --ref: #898781; --min: #3987e5; --bubble: #d95926; --shaker: #199e70; --insertion: #c98500; --binsert: #d55181; --shell: #9085e9; --ref: #898781; }
  }
  .viz text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--ink2); }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .axlabel { font-size: 12px; fill: var(--ink2); }
  .label { font-size: 12px; fill: var(--ink); }
  .legend { font-size: 12px; fill: var(--ink2); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ci { stroke-width: 1.5; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .leader { stroke: var(--muted); stroke-width: 1; }
  .panel { fill: var(--surface); }
</style>
<rect width="100%" height="100%" fill="var(--surface)"/>
<text class="title" x="24" y="30">When the quadratic sorts stop</text>
<text class="sub" x="24" y="49">Mean time of one sort of n random keys, with its 95% confidence interval. A sort stops when it is slower than the slowest O(n log n) sort.</text>
<line x1="24.0" x2="38.0" y1="72.0" y2="72.0" style="stroke: var(--min)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="44.0" y="76.0">Min sort, stopped at n = 128</text>
<line x1="258.0" x2="272.0" y1="72.0" y2="72.0" style="stroke: var(--bubble)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="278.0" y="76.0">Bubble sort, stopped at n = 45</text>
<line x1="506.0" x2="520.0" y1="72.0" y2="72.0" style="stroke: var(--shaker)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="526.0" y="76.0">Shaker sort, stopped at n = 45</text>
<line x1="24.0" x2="38.0" y1="90.0" y2="90.0" style="stroke: var(--insertion)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="44.0" y="94.0">Insertion sort, stopped at n = 362</text>
<line x1="300.0" x2="314.0" y1="90.0" y2="90.0" style="stroke: var(--binsert)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="320.0" y="94.0">Binary insertion, stopped at n = 512</text>
<line x1="590.0" x2="604.0" y1="90.0" y2="90.0" style="stroke: var(--shell)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="610.0" y="94.0">Shell sort, stopped at n = 2,048</text>
<line x1="24.0" x2="38.0" y1="108.0" y2="108.0" style="stroke: var(--ref)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/>
<text class="legend" x="44.0" y="112.0">Slowest O(n log n) sort</text>
<rect class="panel" x="96.0" y="134.0" width="614.0" height="306.0"/>
<line class="grid" x1="96.0" x2="710.0" y1="440.0" y2="440.0"/>
<text class="tick" x="88.0" y="444.0" text-anchor="end">1 ns</text>
<line class="grid" x1="96.0" x2="710.0" y1="389.0" y2="389.0"/>
<text class="tick" x="88.0" y="393.0" text-anchor="end">10 ns</text>
<line class="grid" x1="96.0" x2="710.0" y1="338.0" y2="338.0"/>
<text class="tick" x="88.0" y="342.0" text-anchor="end">100 ns</text>
<line class="grid" x1="96.0" x2="710.0" y1="287.0" y2="287.0"/>
<text class="tick" x="88.0" y="291.0" text-anchor="end">1 µs</text>
<line class="grid" x1="96.0" x2="710.0" y1="236.0" y2="236.0"/>
<text class="tick" x="88.0" y="240.0" text-anchor="end">10 µs</text>
<line class="grid" x1="96.0" x2="710.0" y1="185.0" y2="185.0"/>
<text class="tick" x="88.0" y="189.0" text-anchor="end">100 µs</text>
<line class="grid" x1="96.0" x2="710.0" y1="134.0" y2="134.0"/>
<text class="tick" x="88.0" y="138.0" text-anchor="end">1 ms</text>
<line class="grid" x1="214.8" x2="214.8" y1="134.0" y2="440.0"/>
<text class="tick" x="214.8" y="456.0" text-anchor="middle">10</text>
<line class="grid" x1="384.8" x2="384.8" y1="134.0" y2="440.0"/>
<text class="tick" x="384.8" y="456.0" text-anchor="middle">100</text>
<line class="grid" x1="554.7" x2="554.7" y1="134.0" y2="440.0"/>
<text class="tick" x="554.7" y="456.0" text-anchor="middle">1K</text>
<line class="axis" x1="96.0" x2="710.0" y1="440.0" y2="440.0"/>
<text class="axlabel" x="403.0" y="474.0" text-anchor="middle">Number of keys, n</text>
<text class="axlabel" transform="translate(38.0,287.0) rotate(-90)" text-anchor="middle">Time of one sort</text>
<path class="line" d="M96.0,338.0 L125.9,333.2 L147.2,330.0 L177.1,322.6 L198.3,313.0 L221.8,303.1 L249.5,292.8 L276.3,282.9 L300.7,274.9 L325.8,266.4 L351.8,257.8 L377.8,249.3 L403.0,241.0 L428.6,232.5 L454.2,224.1 L479.7,216.0 L505.3,207.7 L530.9,199.4 L556.5,191.3 L582.1,183.0 L607.7,174.9 L633.2,166.6 L658.8,158.5 L684.4,150.3 L710.0,141.8" style="stroke: var(--ref)" stroke-dasharray="5 3"/>
<path class="line" d="M96.0,382.9 L125.9,367.4 L147.2,360.9 L177.1,348.1 L198.3,337.7 L221.8,323.7 L249.5,307.9 L276.3,294.9 L300.7,284.2 L325.8,273.6 L351.8,262.6 L377.8,251.6 L403.0,240.6" style="stroke: var(--min)"/>
<circle class="dot" cx="403.0" cy="240.6" r="4.5" style="fill: var(--min)"/>
<path class="line" d="M96.0,393.2 L125.9,379.2 L147.2,369.7 L177.1,351.3 L198.3,337.1 L221.8,322.4 L249.5,305.9 L276.3,290.9 L300.7,277.4 L325.8,263.4" style="stroke: var(--bubble)"/>
<circle class="dot" cx="325.8" cy="263.4" r="4.5" style="fill: var(--bubble)"/>
<path class="line" d="M96.0,388.6 L125.9,375.0 L147.2,363.7 L177.1,348.9 L198.3,336.5 L221.8,321.6 L249.5,306.2 L276.3,291.5 L300.7,278.2 L325.8,264.5" style="stroke: var(--shaker)"/>
<circle class="dot" cx="325.8" cy="264.5" r="4.5" style="fill: var(--shaker)"/>
<path class="line" d="M96.0,396.2 L125.9,380.6 L147.2,370.3 L177.1,355.6 L198.3,345.6 L221.8,335.9 L249.5,324.6 L276.3,313.7 L300.7,303.5 L325.8,292.5 L351.8,280.6 L377.8,268.1 L403.0,255.4 L428.6,241.9 L454.2,228.1 L479.7,213.7" style="stroke: var(--insertion)"/>
<circle class="dot" cx="479.7" cy="213.7" r="4.5" style="fill: var(--insertion)"/>
<path class="line" d="M96.0,390.3 L125.9,374.1 L147.2,362.6 L177.1,348.1 L198.3,336.4 L221.8,324.6 L249.5,310.7 L276.3,297.0 L300.7,286.2 L325.8,275.8 L351.8,265.3 L377.8,255.2 L403.0,245.7 L428.6,236.0 L454.2,226.2 L479.7,216.7 L505.3,206.8" style="stroke: var(--binsert)"/>
<circle class="dot" cx="505.3" cy="206.8" r="4.5" style="fill: var(--binsert)"/>
<path class="line" d="M96.0,346.5 L125.9,343.6 L147.2,340.8 L177.1,335.1 L198.3,327.9 L221.8,319.3 L249.5,309.2 L276.3,299.0 L300.7,290.0 L325.8,280.2 L351.8,270.4 L377.8,260.3 L403.0,250.6 L428.6,240.8 L454.2,231.1 L479.7,221.2 L505.3,211.6 L530.9,201.5 L556.5,192.5 L582.1,183.1 L607.7,173.7" style="stroke: var(--shell)"/>
<circle class="dot" cx="607.7" cy="173.7" r="4.5" style="fill: var(--shell)"/>
<line class="leader" x1="716.0" y1="141.8" x2="720.0" y2="141.8"/>
<text class="label" x="724.0" y="145.8">Slowest O(n log n)</text>
</svg>
