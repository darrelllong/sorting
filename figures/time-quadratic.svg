<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
<title id="t">The quadratic sorts and Shell sort against the slowest O(n log n) sort</title>
<desc id="d">Log-log plot of the time of one sort against n for five quadratic sorts, Shell sort, and the slowest O(n log n) sort at each n.</desc>
<style>
  .viz { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
         --grid: #e1e0d9; --axis: #c3c2b7; --ref: #898781; --min: #2a78d6; --bubble: #eb6834; --shaker: #1baf7a; --insertion: #eda100; --binsert: #e87ba4; --shell: #4a3aa7; --ref: #898781; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
           --grid: #2c2c2a; --axis: #383835; --ref: #898781; --min: #3987e5; --bubble: #d95926; --shaker: #199e70; --insertion: #c98500; --binsert: #d55181; --shell: #9085e9; --ref: #898781; }
  }
  .viz text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--ink2); }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .axlabel { font-size: 12px; fill: var(--ink2); }
  .label { font-size: 12px; fill: var(--ink); }
  .legend { font-size: 12px; fill: var(--ink2); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ci { stroke-width: 1.5; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .leader { stroke: var(--muted); stroke-width: 1; }
  .panel { fill: var(--surface); }
</style>
<rect width="100%" height="100%" fill="var(--surface)"/>
<text class="title" x="24" y="30">The quadratic sorts and Shell sort against the slowest O(n log n) sort</text>
<text class="sub" x="24" y="49">Mean time of one sort of n random keys. A dot is the first size at which a sort was slower than the slowest O(n log n) sort.</text>
<line x1="24.0" x2="38.0" y1="72.0" y2="72.0" style="stroke: var(--min)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="44.0" y="76.0">Min sort, slower from n = 91</text>
<line x1="258.0" x2="272.0" y1="72.0" y2="72.0" style="stroke: var(--bubble)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="278.0" y="76.0">Bubble sort, slower from n = 32</text>
<line x1="513.0" x2="527.0" y1="72.0" y2="72.0" style="stroke: var(--shaker)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="533.0" y="76.0">Shaker sort, slower from n = 32</text>
<line x1="24.0" x2="38.0" y1="90.0" y2="90.0" style="stroke: var(--insertion)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="44.0" y="94.0">Insertion sort, slower from n = 362</text>
<line x1="307.0" x2="321.0" y1="90.0" y2="90.0" style="stroke: var(--binsert)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="327.0" y="94.0">Binary insertion, slower from n = 362</text>
<line x1="604.0" x2="618.0" y1="90.0" y2="90.0" style="stroke: var(--shell)" stroke-width="2" stroke-linecap="round"/>
<text class="legend" x="624.0" y="94.0">Shell sort, slower from n = 1,024</text>
<line x1="24.0" x2="38.0" y1="108.0" y2="108.0" style="stroke: var(--ref)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/>
<text class="legend" x="44.0" y="112.0">Slowest O(n log n) sort</text>
<rect class="panel" x="96.0" y="134.0" width="614.0" height="306.0"/>
<line class="grid" x1="96.0" x2="710.0" y1="440.0" y2="440.0"/>
<text class="tick" x="88.0" y="444.0" text-anchor="end">1 ns</text>
<line class="grid" x1="96.0" x2="710.0" y1="409.4" y2="409.4"/>
<text class="tick" x="88.0" y="413.4" text-anchor="end">10 ns</text>
<line class="grid" x1="96.0" x2="710.0" y1="378.8" y2="378.8"/>
<text class="tick" x="88.0" y="382.8" text-anchor="end">100 ns</text>
<line class="grid" x1="96.0" x2="710.0" y1="348.2" y2="348.2"/>
<text class="tick" x="88.0" y="352.2" text-anchor="end">1 µs</text>
<line class="grid" x1="96.0" x2="710.0" y1="317.6" y2="317.6"/>
<text class="tick" x="88.0" y="321.6" text-anchor="end">10 µs</text>
<line class="grid" x1="96.0" x2="710.0" y1="287.0" y2="287.0"/>
<text class="tick" x="88.0" y="291.0" text-anchor="end">100 µs</text>
<line class="grid" x1="96.0" x2="710.0" y1="256.4" y2="256.4"/>
<text class="tick" x="88.0" y="260.4" text-anchor="end">1 ms</text>
<line class="grid" x1="96.0" x2="710.0" y1="225.8" y2="225.8"/>
<text class="tick" x="88.0" y="229.8" text-anchor="end">10 ms</text>
<line class="grid" x1="96.0" x2="710.0" y1="195.2" y2="195.2"/>
<text class="tick" x="88.0" y="199.2" text-anchor="end">100 ms</text>
<line class="grid" x1="96.0" x2="710.0" y1="164.6" y2="164.6"/>
<text class="tick" x="88.0" y="168.6" text-anchor="end">1 s</text>
<line class="grid" x1="96.0" x2="710.0" y1="134.0" y2="134.0"/>
<text class="tick" x="88.0" y="138.0" text-anchor="end">10 s</text>
<line class="grid" x1="191.0" x2="191.0" y1="134.0" y2="440.0"/>
<text class="tick" x="191.0" y="456.0" text-anchor="middle">10</text>
<line class="grid" x1="327.0" x2="327.0" y1="134.0" y2="440.0"/>
<text class="tick" x="327.0" y="456.0" text-anchor="middle">100</text>
<line class="grid" x1="463.0" x2="463.0" y1="134.0" y2="440.0"/>
<text class="tick" x="463.0" y="456.0" text-anchor="middle">1K</text>
<line class="grid" x1="599.0" x2="599.0" y1="134.0" y2="440.0"/>
<text class="tick" x="599.0" y="456.0" text-anchor="middle">10K</text>
<line class="axis" x1="96.0" x2="710.0" y1="440.0" y2="440.0"/>
<text class="axlabel" x="403.0" y="474.0" text-anchor="middle">Number of keys, n</text>
<text class="axlabel" transform="translate(38.0,287.0) rotate(-90)" text-anchor="middle">Time of one sort</text>
<path class="line" d="M96.0,378.8 L119.9,376.1 L136.9,374.0 L160.9,369.7 L177.9,365.8 L196.7,360.8 L218.8,355.2 L240.2,349.1 L259.7,344.1 L279.9,338.6 L300.7,333.4 L321.5,327.7 L341.6,322.9 L362.1,317.3 L382.5,312.3 L403.0,307.1 L423.5,302.2 L443.9,296.9 L464.4,292.1 L484.9,286.5 L505.3,282.0 L525.8,276.7 L546.3,272.0 L566.7,266.7 L587.2,262.0 L607.7,256.8 L628.1,252.0 L648.6,246.5 L669.1,241.9 L689.5,236.7 L710.0,232.0" style="stroke: var(--ref)" stroke-dasharray="5 3"/>
<path class="line" d="M96.0,405.8 L119.9,396.5 L136.9,392.6 L160.9,384.8 L177.9,378.6 L196.7,370.3 L218.8,360.8 L240.2,353.1 L259.7,346.6 L279.9,340.2 L300.7,333.6 L321.5,327.0 L341.6,320.3 L464.4,275.3 L587.2,222.9 L710.0,168.1" style="stroke: var(--min)"/>
<circle class="dot" cx="321.5" cy="327.0" r="4.5" style="fill: var(--min)"/>
<path class="line" d="M96.0,411.9 L119.9,403.4 L136.9,397.8 L160.9,386.8 L177.9,378.2 L196.7,369.4 L218.8,359.6 L240.2,350.6 L259.7,342.5 L341.6,308.7 L464.4,259.1 L587.2,202.1 L710.0,141.8" style="stroke: var(--bubble)"/>
