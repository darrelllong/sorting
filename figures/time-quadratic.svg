<path class="line" d="M96.0,413.8 L119.9,404.4 L136.9,398.2 L160.9,389.4 L177.9,383.4 L196.7,377.5 L218.8,370.8 L240.2,364.2 L259.7,358.1 L279.9,351.5 L300.7,344.4 L321.5,336.7 L341.6,329.2 L362.1,321.0 L382.5,312.7 L403.0,304.2 L464.4,277.8 L587.2,222.9 L710.0,167.8" style="stroke: var(--insertion)"/>
<circle class="dot" cx="403.0" cy="304.2" r="4.5" style="fill: var(--insertion)"/>
<path class="line" d="M96.0,410.2 L119.9,400.4 L136.9,393.5 L160.9,384.8 L177.9,378.0 L196.7,370.8 L218.8,362.3 L240.2,354.3 L259.7,347.8 L279.9,341.5 L300.7,335.3 L321.5,329.1 L341.6,323.3 L362.1,317.6 L382.5,311.6 L403.0,306.0 L464.4,287.6 L587.2,242.5 L710.0,189.7" style="stroke: var(--binsert)"/>
<circle class="dot" cx="403.0" cy="306.0" r="4.5" style="fill: var(--binsert)"/>
<path class="line" d="M96.0,383.9 L119.9,382.2 L136.9,380.5 L160.9,377.0 L177.9,372.8 L196.7,367.6 L218.8,361.5 L240.2,355.5 L259.7,350.0 L279.9,344.2 L300.7,338.3 L321.5,332.1 L341.6,326.4 L362.1,320.4 L382.5,314.7 L403.0,308.8 L423.5,303.0 L443.9,297.3 L464.4,291.4 L587.2,253.8 L710.0,222.0" style="stroke: var(--shell)"/>
<circle class="dot" cx="464.4" cy="291.4" r="4.5" style="fill: var(--shell)"/>
