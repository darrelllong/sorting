<text class="label" x="724.0" y="145.8">Bubble sort</text>
<line class="leader" x1="716.0" y1="145.1" x2="720.0" y2="155.8"/>
<text class="label" x="724.0" y="159.8">Shaker sort</text>
<line class="leader" x1="716.0" y1="167.8" x2="720.0" y2="169.8"/>
<text class="label" x="724.0" y="173.8">Insertion sort</text>
