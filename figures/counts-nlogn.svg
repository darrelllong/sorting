<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
<title id="t">Comparisons and moves of the O(n log n) sorts</title>
<desc id="d">Mean counts of one sort divided by n log₂ n.</desc>
<style>
  .viz { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
         --grid: #e1e0d9; --axis: #c3c2b7; --ref: #898781; --quick: #2a78d6; --quicki: #eb6834; --bfs: #1baf7a; --merge: #eda100; --heap: #e87ba4; --shell: #4a3aa7; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
           --grid: #2c2c2a; --axis: #383835; --ref: #898781; --quick: #3987e5; --quicki: #d95926; --bfs: #199e70; --merge: #c98500; --heap: #d55181; --shell: #9085e9; }
